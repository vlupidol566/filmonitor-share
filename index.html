  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #09111d; color: #fff; }
    main { max-width: 32rem; padding: 2rem; text-align: center; }
    a { color: #77a8ff; }
  </style>
</head>
<body>
  <main>
    <h1>ФилМонитор</h1>
    <p>Открываем публичную статистику…</p>
    <p><a id="fallback" href="https://filmonitor.ru/">Перейти вручную</a></p>
  </main>
  <script>
    (() => {
      const rawPath = window.location.hash.replace(/^#/, '');
      const path = rawPath.startsWith('/') ? rawPath : `/${rawPath}`;
      const allowed = /^\/(?:p|s|a|share)(?:\/|$)/.test(path);
      const target = allowed ? `https://filmonitor.ru${path}` : 'https://filmonitor.ru/';
      document.getElementById('fallback').href = target;
      window.location.replace(target);
    })();
  </script>
</body>
